<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Read Japanese at your own pace. Understand the words, and what they really mean."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="読む" />
    <meta name="theme-color" content="#141815" />
    <title>Yomu</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <section id="lock-screen" class="lock-screen">
      <form id="login-form">
        <h1 lang="ja">読む</h1>
        <input id="password" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required />
        <button class="primary" id="unlock-btn">Unlock</button>
        <p id="login-error" role="alert"></p>
      </form>
    </section>
    <div id="app-shell" class="hidden">
    <header class="header">
      <a class="brand" href="/" aria-label="Yomu home"><span lang="ja">読む</span></a>
      <button id="settings-btn" class="quiet-button">Settings</button>
    </header>
    <main>
      <section id="welcome" class="welcome">
        <div class="entry-actions">
          <button id="camera-btn" class="primary">Take photo</button>
          <button id="upload-btn" class="secondary">Upload</button>
        </div>
        <button id="resume-btn" class="resume-button hidden">Resume</button>
      </section>
      <section id="reader" class="reader hidden" aria-label="Japanese reader">
        <div class="reader-top">
          <button id="new-page" class="text-button">← Back</button
          ><div class="next-page-actions"><button id="next-photo" class="primary">Next photo</button><button id="next-upload" class="quiet-button" aria-label="Upload next image">Upload</button></div><span id="page-status" class="micro" role="status"></span>
        </div>
        <div class="reader-grid">
          <div class="page-column">
            <div class="reader-toolbar">
              <div class="mode-switch" aria-label="Selection mode">
                <button id="bubble-mode" aria-pressed="true">
                  Bubbles</button
                ><button id="word-mode" aria-pressed="false">Words</button>
              </div>
              <button id="multi-select" class="quiet-button" aria-pressed="true">Select multiple</button>
              <button id="retry-ocr" class="text-button hidden">
                Retry scan
              </button>
            </div>
            <div id="photo-zoom" class="photo-zoom hidden">
              <button id="zoom-out" class="quiet-button" aria-label="Zoom out">
                −</button
              ><span id="zoom-label" class="micro">100%</span
              ><button id="zoom-in" class="quiet-button" aria-label="Zoom in">
                ＋
              </button>
            </div>
            <div id="photo-scroll">
              <div id="photo-container" class="hidden">
                <img id="photo-img" alt="Your Japanese page" />
                <div id="tap-overlay"></div>
              </div>
            </div>
            <div id="text-page" class="text-page" lang="ja"></div>
            <div id="scan-state" class="notice hidden" role="status"></div>
          </div>
          <aside class="understand" id="understand">
            <div class="selection-heading"><button id="clear-selection" class="text-button">Clear</button></div>
            <div id="selected-text" lang="ja"></div>
            <div class="explain-actions">
              <select id="learner-level" aria-label="Japanese learner level">
                <option value="N5">N5 · Beginner</option>
                <option value="N4">N4 · Elementary</option>
                <option value="N3">N3 · Intermediate</option>
                <option value="N2" selected>N2 · Advanced</option>
                <option value="N1">N1 · Proficient</option></select
              ><button id="explain-btn" class="primary">Explain</button>
            </div>
            <div id="explanation" aria-live="polite"></div>
          </aside>
        </div>
      </section>
    </main>
    </div>
    <button id="selection-jump" class="selection-jump hidden">
      Explain ↓
    </button>
    <input
      type="file"
      id="camera-input"
      accept="image/*"
      capture="environment"
      hidden
    />
    <input type="file" id="upload-input" accept="image/*" hidden />
    <dialog id="settings-dialog">
      <div class="dialog-heading">
        <h2>Preferences</h2>
        <button
          id="settings-close"
          class="quiet-button"
          aria-label="Close preferences"
        >
          ✕
        </button>
      </div>
      <button id="forget-page" class="text-button">Forget saved page</button>
      <button id="lock-btn" class="text-button">Lock</button>
    </dialog>
    <dialog id="word-dialog">
      <div class="dialog-heading">
        <span class="eyebrow">WORD LOOKUP</span
        ><button
          id="word-close"
          class="quiet-button"
          aria-label="Close definition"
        >
          ✕
        </button>
      </div>
      <div id="word-content" aria-live="polite"></div>
    </dialog>
    <div id="toast" class="hidden" role="status"></div>
    <script src="js/api.js" defer></script>
    <script src="js/kuromoji.js" defer></script>
    <script src="js/morphology.js" defer></script>
    <script src="js/dict.js" defer></script>
    <script src="js/explanations.js" defer></script>
    <script src="js/vision.js" defer></script>
    <script src="js/camera.js" defer></script>
    <script src="js/session.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
