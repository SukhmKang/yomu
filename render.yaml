services:
  - type: web
    name: yomu-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:backend
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: HOST
        value: 0.0.0.0
      - key: APP_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ALLOWED_ORIGINS
        sync: false
